name: food_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.1
  path_provider: ^2.0.15
  image_picker: ^0.8.7+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon" # Or true to use default names
  ios: true
  image_path: "assets/logo/app/ChowPremacy.png"
  remove_alpha_ios: true 
  
flutter:
  uses-material-design: true
  assets:
    - assets/food_images/Burgers/
    - assets/food_images/Pizzas/
    - assets/food_images/Chicken/
    - assets/food_images/Fries/
    - assets/food_images/Drinks/
    - assets/food_images/Category/
    - assets/logo/facebook/
    - assets/logo/google/
    - assets/logo/payment_modes/
    - assets/logo/app/
    - assets/avatars/
    - assets/deliverypage/bag/
    - assets/deliverypage/rider/

