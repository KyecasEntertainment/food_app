name: food_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/food_images/Burgers/
    - assets/food_images/Pizzas/
    - assets/food_images/Chicken/
    - assets/food_images/Fries/
    - assets/food_images/Drinks/
    - assets/food_images/Category/
